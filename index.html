      .site-tabs {

        flex-wrap: wrap;

        border-bottom: 2px solid var(--edge);

        padding: 8px 18px;
        border-radius: 6px 6px 0 0;
        color: var(--dim);
        text-decoration: none;
      }

        color: var(--fg);

        color: var(--fg);
        box-shadow: inset 0 3px 0 var(--accent);
